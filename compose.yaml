name: debook
services:
  outbox-relay:
    build: .
    entrypoint: ["outbox"]
    environment:
      DATABASE_URL: postgres://debook:debook_local@postgres:5432/debook
      KAFKA_BROKERS: kafka:19092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  workflow:
    build: .
    entrypoint: ["workflow"]
    environment:
      DATABASE_URL: postgres://debook:debook_local@postgres:5432/debook
      KAFKA_BROKERS: kafka:19092
      AUTHEO_NETWORK: ${AUTHEO_NETWORK:-testnet}
      AUTHEO_RPC_URL: ${AUTHEO_RPC_URL:-https://rpc.testnet.autheo.com}
      AUTHEO_CHAIN_ID: ${AUTHEO_CHAIN_ID:-21270}
      AUTHEO_CONTRACT_ADDRESS: ${AUTHEO_CONTRACT_ADDRESS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173}
      AUTHEO_PRIVATE_KEY: ${AUTHEO_PRIVATE_KEY:-}
      AUTHEO_CONFIRMATIONS: ${AUTHEO_CONFIRMATIONS:-2}
      AUTHEO_TX_TIMEOUT: ${AUTHEO_TX_TIMEOUT:-2m}
      AUTHEO_MAX_RETRIES: ${AUTHEO_MAX_RETRIES:-5}
      AUTHEO_COSMOS_RPC_URL: ${AUTHEO_COSMOS_RPC_URL:-https://cosmos-rpc.testnet.autheo.com}
      AUTHEO_REST_URL: ${AUTHEO_REST_URL:-https://rest.testnet.autheo.com}
      AUTHEO_FAUCET_URL: ${AUTHEO_FAUCET_URL:-https://faucet.testnet.autheo.com}
      AUTHEO_EVM_EXPLORER_URL: ${AUTHEO_EVM_EXPLORER_URL:-https://evm-explorer.testnet.autheo.com}
      AUTHEO_COSMOS_EXPLORER_URL: ${AUTHEO_COSMOS_EXPLORER_URL:-https://cosmos.testnet.autheo.com}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://debook:debook_local@postgres:5432/debook
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173}
      AUTHEO_RPC_URL: ${AUTHEO_RPC_URL:-https://rpc.testnet.autheo.com}
      AUTHEO_CONTRACT_ADDRESS: ${AUTHEO_CONTRACT_ADDRESS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: debook
      POSTGRES_USER: debook
      POSTGRES_PASSWORD: debook_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debook -d debook"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 20
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: debook
      CLICKHOUSE_USER: debook
      CLICKHOUSE_PASSWORD: debook_local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "debook", "--password", "debook_local", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.11.0
    environment:
      SWAGGER_JSON: /openapi.yaml
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./docs/openapi.yaml:/openapi.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  clickhouse-data:
  prometheus-data:
